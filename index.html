<head>
    <meta charset="utf-8">

    <meta name="description" content="Приглашение на свадьбу Эльдияра и Жамили. 9 сентября 2026, ресторан Ak Bulut, Бишкек.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://eldiyar-zhamilia.com/ru/">
    <link rel="alternate" hreflang="ru" href="https://eldiyar-zhamilia.com/ru/">

    <link rel="alternate" hreflang="x-default" href="https://eldiyar-zhamilia.com/ru/">
    <meta property="og:title" content="Эльдияр &amp; Жамиля - приглашение на свадьбу">
    <meta property="og:description" content="Приглашаем Вас на свадьбу 9 сентября 2026 года в ресторане Ak Bulut.">
    <meta property="og:url" content="https://eldiyar-zhamilia.com/ru/">
    <meta property="og:image" content="https://eldiyar-zhamilia.com/img/background.JPEG">
    <meta property="og:type" content="website">

    <noscript>
        <meta http-equiv="refresh" content="0; url=/ru/">
    </noscript>
    <script>
        (function () {
            var saved = null;
            try {
                saved = localStorage.getItem('wedding_lang');
            } catch (e) {}
            var lang = 'ru';
            if (saved === 'kg' || saved === 'ky') {
                lang = 'kg';
            } else if (saved === 'ru') {
                lang = 'ru';
            } else {
                var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
                nav = String(nav).toLowerCase();
                if (nav.indexOf('ky') === 0 || nav.indexOf('kg') === 0) {
                    lang = 'kg';
                }
            }
            var hash = window.location.hash || '';
            window.location.replace('/' + lang + '/' + hash);
        })();
    </script>
</head>
<body>

</body>
